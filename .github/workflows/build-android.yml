name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Generar AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar .NET y workload de Android
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          workloads: maui-android

      - name: Reconstruir keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta el secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/contabee-release.keystore"
          chmod 600 "$RUNNER_TEMP/contabee-release.keystore"

      - name: Generar y validar AAB firmado
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/contabee-release.keystore
          ANDROID_SIGNING_KEY_ALIAS: contabee
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./build-android-release.sh

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: contabee-android-${{ github.run_number }}
          path: ContaBeeMovil/bin/Release/net10.0-android/publish/*-Signed.aab
          if-no-files-found: error
          retention-days: 14
