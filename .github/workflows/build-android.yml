name: Build Android

on:
  workflow_dispatch:
    inputs:
      upload_to_google_play:
        description: Subir el AAB a la pista interna como borrador
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      upload_to_google_play:
        description: Subir el AAB a la pista interna como borrador
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGNING_PASSWORD:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Generar AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar .NET y workload de Android
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          workloads: maui-android

      - name: Mostrar versiones instaladas
        shell: bash
        run: |
          dotnet --version
          dotnet workload --version

      - name: Reconstruir keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta el secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/contabee-release.keystore"
          chmod 600 "$RUNNER_TEMP/contabee-release.keystore"

      - name: Generar y validar AAB firmado
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/contabee-release.keystore
          ANDROID_SIGNING_KEY_ALIAS: contabee
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./build-android-release.sh

      - name: Guardar AAB
        uses: actions/upload-artifact@v7
        with:
          name: contabee-android-${{ github.run_number }}
          path: ContaBeeMovil/bin/Release/net10.0-android/publish/*-Signed.aab
          if-no-files-found: error
          retention-days: 14

      - name: Subir AAB a Google Play como borrador
        if: ${{ inputs.upload_to_google_play }}
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_PACKAGE_NAME: mx.contabee.app
          GOOGLE_PLAY_TRACK: internal
        run: ./upload-google-play.sh
